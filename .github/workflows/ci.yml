name: Compiler checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked
      - run: cargo fmt --check
      - run: sudo apt-get update && sudo apt-get install -y iverilog yosys
      - run: |
          mkdir build
          cargo run --locked -- build examples/adder.vxm -o build/adder.sv
          cargo run --locked -- build examples/register.vxm -o build/register_demo.sv
          cargo run --locked -- build examples/uart_tx.vxm -o build/uart_tx.sv
          sh tests/hdl.sh
